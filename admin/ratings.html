<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bewertungen moderieren | Svens Kochbuch</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f7f5f0; }
    body { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .meta { color: #666; margin-bottom: 24px; font-size: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="password"], input[type="text"], select {
      width: 100%; max-width: 420px; padding: 10px 12px;
      border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px;
      font: inherit; background: #fff;
    }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-right: 8px; }
    button.primary { background: #b8860b; color: #fff; border-color: #b8860b; }
    button.danger { background: #c0392b; color: #fff; border-color: #c0392b; }
    .card { background: #fff; border: 1px solid #e5e0d6; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .stars { color: #b8860b; letter-spacing: 2px; }
    .err { color: #c0392b; margin-top: 12px; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { background: #fff; border: 1px solid #e5e0d6; border-radius: 10px; padding: 12px 16px; min-width: 120px; }
    .stat strong { display: block; font-size: 1.4rem; }
    details.advanced { margin: 8px 0 16px; max-width: 420px; color: #666; font-size: 14px; }
    details.advanced summary { cursor: pointer; font-weight: 600; color: #444; margin-bottom: 8px; }
    details.advanced[open] summary { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Bewertungen moderieren</h1>
  <p class="meta">Nur für Admin. Diese Seite ist nicht indexiert.</p>

  <div id="loginPanel">
    <label for="roleSelect">Rolle</label>
    <select id="roleSelect">
      <option value="admin">Admin</option>
    </select>

    <label for="adminToken">Passwort</label>
    <input type="password" id="adminToken" autocomplete="current-password" />

    <button type="button" class="primary" id="loginBtn">Anmelden</button>

    <details class="advanced" id="advancedSettings">
      <summary>Erweiterte Einstellungen</summary>
      <label for="apiBase">API-Basis-URL</label>
      <input type="text" id="apiBase" value="/api" placeholder="/api" autocomplete="off" />
    </details>

    <p class="err" id="loginErr" hidden></p>
  </div>

  <div id="mainPanel" hidden>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </div>

  <script>
    (function () {
      var DEFAULT_API_BASE = '/api';
      var API_BASE_STORAGE_KEY = 'svens_admin_api_base';

      var roleSelect = document.getElementById('roleSelect');
      var tokenInput = document.getElementById('adminToken');
      var loginBtn = document.getElementById('loginBtn');
      var loginErr = document.getElementById('loginErr');
      var mainPanel = document.getElementById('mainPanel');
      var statsEl = document.getElementById('stats');
      var listEl = document.getElementById('list');
      var advancedSettings = document.getElementById('advancedSettings');
      var apiBaseInput = document.getElementById('apiBase');

      function looksLikeApiBase(value) {
        if (!value) return true;
        return value.charAt(0) === '/' || /^https?:\/\//i.test(value);
      }

      function normalizeApiBaseValue(raw) {
        raw = (raw || '').trim();
        if (!raw || !looksLikeApiBase(raw)) return DEFAULT_API_BASE;
        return raw.replace(/\/+$/, '');
      }

      function normalizeApiBaseInput() {
        apiBaseInput.value = normalizeApiBaseValue(apiBaseInput.value);
      }

      function loadStoredApiBase() {
        try {
          var stored = localStorage.getItem(API_BASE_STORAGE_KEY);
          if (stored && looksLikeApiBase(stored)) {
            apiBaseInput.value = normalizeApiBaseValue(stored);
          }
        } catch (err) {
          /* ignore */
        }
      }

      function saveApiBaseIfAdvanced() {
        if (!advancedSettings.open) return;
        normalizeApiBaseInput();
        try {
          if (apiBaseInput.value === DEFAULT_API_BASE) {
            localStorage.removeItem(API_BASE_STORAGE_KEY);
          } else {
            localStorage.setItem(API_BASE_STORAGE_KEY, apiBaseInput.value);
          }
        } catch (err) {
          /* ignore */
        }
      }

      function base() {
        if (!advancedSettings.open) return DEFAULT_API_BASE;
        return normalizeApiBaseValue(apiBaseInput.value);
      }

      function token() {
        return tokenInput.value.trim();
      }

      function userError(status) {
        if (status === 401) return 'Passwort falsch oder keine Admin-Berechtigung.';
        return 'Bewertungs-API nicht erreichbar. Bitte später erneut versuchen.';
      }

      function countOf(data, key) {
        if (!data) return 0;
        var direct = data[key];
        if (Array.isArray(direct)) return direct.length;
        if (direct != null && typeof direct === 'object' && direct.count != null) {
          return Number(direct.count) || 0;
        }
        if (data.summary && data.summary[key] != null) return Number(data.summary[key]) || 0;
        if (data.counts && data.counts[key] != null) return Number(data.counts[key]) || 0;
        if (direct != null && direct !== '' && !isNaN(Number(direct))) return Number(direct);
        return 0;
      }

      function renderStats(data) {
        var pending = countOf(data, 'pending');
        var approved = countOf(data, 'approved');
        var rejected = countOf(data, 'rejected');
        statsEl.innerHTML =
          '<div class="stat"><strong>' + pending + '</strong> Ausstehend</div>' +
          '<div class="stat"><strong>' + approved + '</strong> Freigegeben</div>' +
          '<div class="stat"><strong>' + rejected + '</strong> Abgelehnt</div>';
      }

      function stars(n) {
        var s = '';
        for (var i = 1; i <= 5; i++) s += i <= n ? '\u2605' : '\u2606';
        return s;
      }

      async function apiFetch(path, opts) {
        opts = opts || {};
        var headers = Object.assign({ Authorization: 'Bearer ' + token() }, opts.headers || {});
        var url = base() + path;
        var res;
        try {
          res = await fetch(url, Object.assign({}, opts, { headers: headers }));
        } catch (err) {
          throw new Error(userError());
        }
        var data = null;
        try {
          data = await res.json();
        } catch (err) {
          data = null;
        }
        if (res.status === 401) {
          throw new Error(userError(401));
        }
        if (!res.ok || data == null || typeof data !== 'object') {
          throw new Error(userError());
        }
        return data;
      }

      async function loadStats() {
        renderStats(await apiFetch('/admin/stats'));
      }

      async function loadPending() {
        var data = await apiFetch('/admin/ratings?status=pending');
        if (!data.ratings || !data.ratings.length) {
          listEl.innerHTML = '<p>Keine ausstehenden Bewertungen.</p>';
          return;
        }
        listEl.innerHTML = data.ratings.map(function (r) {
          return (
            '<div class="card" data-id="' + r.id + '">' +
            '<p><strong>Rezept #' + r.recipe_id + '</strong> · <span class="stars">' + stars(r.rating_value) + '</span></p>' +
            (r.user_name ? '<p>Name: ' + escapeHtml(r.user_name) + '</p>' : '') +
            (r.comment ? '<p>Kommentar: ' + escapeHtml(r.comment) + '</p>' : '') +
            '<p class="meta">' + r.created_at + '</p>' +
            '<button type="button" class="primary" data-action="approve">Freigeben</button>' +
            '<button type="button" class="danger" data-action="reject">Ablehnen</button>' +
            '</div>'
          );
        }).join('');

        listEl.querySelectorAll('[data-action]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var card = btn.closest('.card');
            var id = card.getAttribute('data-id');
            var action = btn.getAttribute('data-action');
            btn.disabled = true;
            try {
              await apiFetch('/admin/ratings/' + id + '/' + action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}'
              });
              await loadStats();
              await loadPending();
            } catch (e) {
              alert(e.message);
              btn.disabled = false;
            }
          });
        });
      }

      function escapeHtml(t) {
        return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      loadStoredApiBase();
      normalizeApiBaseInput();

      apiBaseInput.addEventListener('change', saveApiBaseIfAdvanced);
      apiBaseInput.addEventListener('blur', function () {
        normalizeApiBaseInput();
        saveApiBaseIfAdvanced();
      });

      loginBtn.addEventListener('click', async function () {
        loginErr.hidden = true;
        mainPanel.hidden = true;

        if (roleSelect.value !== 'admin') {
          loginErr.textContent = 'Passwort falsch oder keine Admin-Berechtigung.';
          loginErr.hidden = false;
          return;
        }

        if (!token()) {
          loginErr.textContent = 'Bitte Passwort eingeben.';
          loginErr.hidden = false;
          return;
        }

        if (advancedSettings.open) {
          normalizeApiBaseInput();
          saveApiBaseIfAdvanced();
        }

        try {
          await loadStats();
          await loadPending();
          mainPanel.hidden = false;
        } catch (e) {
          loginErr.textContent = e.message;
          loginErr.hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
